services:
  api_gateway:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: uvicorn rag_api.routes:app --host 0.0.0.0 --port 8000
    env_file:
      - ./api/.env
    environment:
      EMBEDDING_GRPC_URL: embedding_service:50051
      LLM_GRPC_URL: llm_service:50052
      CELERY_BROKER_URL: redis://redis_broker:6379/0
      CELERY_RESULT_BACKEND: redis://redis_broker:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis_broker
      - embedding_service
      - llm_service

  ingestion_worker:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    command: celery -A rag_ingestion.tasks.celery_app worker --loglevel=info
    env_file:
      - ./ingestion/.env
    environment:
      EMBEDDING_GRPC_URL: embedding_service:50051
      CELERY_BROKER_URL: redis://redis_broker:6379/0
      CELERY_RESULT_BACKEND: redis://redis_broker:6379/0
      HF_HOME: /app/model_cache/huggingface
    volumes:
      - model_cache:/app/model_cache
    depends_on:
      - redis_broker
      - embedding_service

  embedding_service:
    build:
      context: .
      dockerfile: embedding/Dockerfile
    env_file:
      - ./embedding/.env
    environment:
      EMBEDDING_GRPC_PORT: 50051
      HF_HOME: /app/model_cache/huggingface
    volumes:
      - model_cache:/app/model_cache

  llm_service:
    build:
      context: .
      dockerfile: llm/Dockerfile.gpu
    env_file:
      - ./llm/.env
    environment:
      LLM_GRPC_HOST: 0.0.0.0
      LLM_GRPC_PORT: 50052
      HF_HOME: /app/model_cache/huggingface
    ports:
      - "50052:50052"
    volumes:
      - model_cache:/app/model_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis_broker:
    image: redis:alpine
    ports:
      - "6379"

  web_client:
    build:
      context: ./rag-web
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api_gateway

volumes:
  model_cache:
