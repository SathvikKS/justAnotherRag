[project]
name = "rag-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.6.3",
    "fastapi[standard]",
    "mcp>=1.28.1,<2",
    "rag-core",
    "rag-grpc",
    "rag-storage",
    "sqlmodel>=0.0.22",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "langchain-postgres>=0.0.12",
    "psycopg[binary]>=3.1.18",
]

[tool.uv.sources]
rag-core = { workspace = true }
rag-grpc = { workspace = true }
rag-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
